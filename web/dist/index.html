// ================= RUN SCENE: RIVAL TRICKS (v5) =================
// Named rivals in sprints play on the beat like the duel rival: one beat of warning ("!"), then the move.
// onde drops a mine, atici fires a slow plasma down your lane, zikzak cuts in front of you, itici barges (06_run).
// Only one rival may telegraph at a time and tricks are spaced out, so two tricks never stack into an unfair spot.
Object.assign(SCENES.run, {
  rivalBeat(b) {
    if (this.state !== 'run' || this.tut) return;
    const P = this.P;
    for (const r of this.rivals) if (r.tele) { const t = r.tele; r.tele = null; if (!r.done && r.stun <= 0) this.rivalAct(r, t); return; }
    if (b < (this.trickBeat || 0)) return;
    const cands = [];
    for (const r of this.rivals) {
      if (r.done || !r.style || r.duel || r.stun > 0 || r.laneT < 1 || b < (r.nextTrick || 0)) continue;
      const gap = r.dist - P.dist, dl = Math.abs(r.lane - P.lane);
      if (r.style === 'atici' && gap > 50 && gap < 210 && dl <= 2 && P.dist < this.length * 0.92) cands.push([r, { kind: 'shot', lane: P.lane }, 8]);
      else if (r.style === 'onde' && gap > 55 && gap < 220 && dl <= 1 && P.dist < this.length * 0.9) cands.push([r, { kind: 'drop' }, 9]);
      else if (r.style === 'zikzak') {
        if (gap > 10 && gap < 70 && dl === 1 && this.laneFree(P.lane, r.dist, r)) cands.push([r, { kind: 'cut', lane: P.lane }, 6]);
        else if (rnd() < 0.25) { // restless lane hops (harmless, but you can never quite predict them)
          const nl = r.lane + R.pick([-1, 1]);
          if (this.laneFree(nl, r.dist, r)) { r.fromX = r.x; r.lane = nl; r.laneT = 0; r.cool = 0.6; }
        }
      }
    }
    if (!cands.length) return;
    const [r, t, cd] = R.pick(cands);
    r.tele = t; r.nextTrick = b + cd; this.trickBeat = b + 3;
    Sound.play(t.kind === 'shot' ? 'warn' : 'hey');
  },
  rivalAct(r, t) {
    const P = this.P;
    if (t.kind === 'shot') {
      this.eShots.push({ x: this.laneX(t.lane), lane: t.lane, dist: r.dist - 10, v: -170, dead: false, rival: true });
      Sound.play('shoot'); this.say('rivalTrick');
    } else if (t.kind === 'drop') {
      const kind = rnd() < 0.5 ? 'civi' : 'puddle';
      this.addObs(kind, r.lane, 1, r.dist - 22, kind === 'puddle' ? { mud: this.reg.mud } : null);
      floatText(kind === 'civi' ? 'MAYIN!' : 'JÖLE!', r.x, this.sy(r.dist) + 2, C.salmon, 1, -6, 0.8); Sound.play('pebble');
    } else if (t.kind === 'cut') {
      const gap = r.dist - P.dist;
      if (gap > 4 && gap < 90 && this.laneFree(t.lane, r.dist, r)) {
        r.fromX = r.x; r.lane = t.lane; r.laneT = 0; r.cool = 1;
        floatText('ÖNÜNÜ KESTİ!', r.x, this.sy(r.dist) - 28, C.salmon, 1, -8, 0.8); this.say('rivalTrick');
      }
    }
  },
  // the "!" over a rival and the lane it is about to hit
  drawRivalTele(r, x, y) {
    const t = r.tele; if (!t || Math.floor(T * 10) % 2) return;
    textO('!', x, y - 36, C.red, 'center', 2);
    if (t.kind === 'cut') textO(t.lane < r.lane ? '←' : '→', x + (t.lane < r.lane ? -12 : 12), y - 4, C.red, 'center');
    else if (t.kind === 'drop') textO('↓', x, y + 14, C.red, 'center');
  }
});

// ================= RUN SCENE: FAIR TRACK (v5) =================
// Every solid thing (asteroids, crates, meteor and worm landings, ice walls) is placed only if a horse can still
// weave through: rows of solids are walked in order and the set of reachable lanes may spread by one lane per
// `laneStep()` of track. If a new piece would close every lane, the generator picks another lane or drops it.
Object.assign(SCENES.run, {
  // world px the horse needs to shift one lane at top speed, with a little reaction time on top
  laneStep() {
    const S = this.S, top = BASE_SPEED * this.reg.speed * S.speed * (1 + S.comboCap * S.comboPer) * 1.1;
    return Math.max(30, top * (S.laneTime + 0.14));
  },
  solidRows(y0, y1, extra) {
    const rows = [];
    const add = (lane, y, span) => {
      let row = rows.find(r => Math.abs(r.y - y) < 14);
      if (!row) { row = { y, b: new Set() }; rows.push(row); }
      for (let l = lane; l < lane + (span || 1); l++) row.b.add(l);
    };
    for (const o of this.obs) if (!o.dead && SOLID[o.kind] && o.y >= y0 && o.y <= y1) add(o.lane, o.y, o.span);
    for (const m of this.meteors || []) if (m.y >= y0 && m.y <= y1) add(m.lane, m.y, 1);
    for (const e of extra) add(e.lane, e.y, 1);
    rows.sort((a, b) => a.y - b.y);
    return rows;
  },
  // can the horse still get through if `extra` solids are added? fromLane/fromY: start from the horse itself
  passable(extra, fromLane, fromY) {
    if (!extra.length) return true;
    let lo = 1e9, hi = -1e9;
    for (const e of extra) { lo = Math.min(lo, e.y); hi = Math.max(hi, e.y); }
    const start = fromY != null ? fromY : lo - 300;
    const rows = this.solidRows(start, hi + 300, extra), step = this.laneStep();
    let reach = fromLane != null ? [fromLane] : [0, 1, 2, 3, 4], py = fromY != null ? fromY : -1e9;
    for (const row of rows) {
      if (row.y <= start) continue;
      const spread = Math.floor((row.y - py) / step), next = [];
      for (let l = 0; l < 5; l++) if (!row.b.has(l) && reach.some(r => Math.abs(r - l) <= spread)) next.push(l);
      if (!next.length) return false;
      reach = next; py = row.y;
    }
    return true;
  },
  // scanner lasers sweep across lanes, so keep solids out of their way
  nearScan(y, d) { return this.obs.some(o => !o.dead && o.kind === 'scan' && Math.abs(o.y - y) < d); },
  nearSolid(y, d) { return this.obs.some(o => !o.dead && SOLID[o.kind] && Math.abs(o.y - y) < d); },
  // place a group of rocks only if the track stays passable
  tryRocks(list, extra) {
    if (list.some(e => this.nearScan(e.y, 70))) return false;
    if (!this.passable(list)) return false;
    for (const e of list) this.addObs(e.kind || 'rock', e.lane, 1, e.y, Object.assign({ v: e.v || 0 }, extra || {}, e.extra || {}));
    return true;
  },
  // lanes for things that land near the horse (meteors, worm, ice walls): keep a way out from where it is now
  pickSafeLanes(n, y, prefer) {
    const P = this.P, out = [];
    const lanes = R.shuffle([0, 1, 2, 3, 4]);
    if (prefer != null) lanes.sort((a, b) => Math.abs(a - prefer) - Math.abs(b - prefer));
    for (const l of lanes) {
      if (out.length >= n) break;
      const trial = out.concat([{ lane: l, y }]);
      if (this.passable(trial, P.lane, P.dist + 20)) out.push({ lane: l, y });
    }
    return out.map(e => e.lane);
  }
});

// ================= GALAKSİ LİGİ (v5.1) =================
// A season table for one run: every sprint hands out points by finishing place (named rivals and Deniz only),
// duels give the winner 8 and the loser 3. At the end of each planet the leader of the table gets crystals.
const LEAGUE_PTS = [10, 7, 5, 4, 3, 2, 1, 0];
const LEAGUE_BONUS = [6, 3, 1];
function leagueAdd(id, n) { RUN.league = RUN.league || {}; RUN.league[id] = (RUN.league[id] || 0) + n; }
// standings: [{ id, name, pts, me }] best first; on equal points Deniz goes first (home crowd)
function leagueTable() {
  const L = (RUN && RUN.league) || {}, rows = [];
  for (const id in L) rows.push({ id, name: id === 'deniz' ? 'DENİZ' : (RIVAL_BY_ID[id] ? RIVAL_BY_ID[id].name : id), pts: L[id], me: id === 'deniz' });
  if (!rows.some(r => r.me)) rows.push({ id: 'deniz', name: 'DENİZ', pts: 0, me: true });
  rows.sort((a, b) => b.pts - a.pts || (b.me ? 1 : 0) - (a.me ? 1 : 0));
  return rows;
}
function leagueRank() { return leagueTable().findIndex(r => r.me) + 1; }
function leagueLeader() { const t = leagueTable(); return t.length && !t[0].me && t[0].pts > 0 ? t[0].id : null; }
// at the end of a planet (after the champion): bonus crystals by league place
function leagueRegionBonus() {
  const me = (RUN.league || {}).deniz || 0;
  if (!me) return; // no sprint or duel points yet: no table to lead
  const rk = leagueRank(), n = LEAGUE_BONUS[rk - 1] || 0;
  if (!n) return;
  RUN.yonca += n; missionEvent('yonca', n);
  if (rk === 1) { missionEvent('league', 1); META.stats.leagueLeads = (META.stats.leagueLeads || 0) + 1; }
  toast('LİG ' + rk + '.: +' + n + ' KRİSTAL', C.gold, 'crown');
}
function drawLeague(onClose) {
  const rows = leagueTable().slice(0, 9);
  const w = Math.min(W - 16, 200), rh = 13, h = 34 + rows.length * rh + 18;
  const x = Math.round(W / 2 - w / 2), y = Math.round(SAFE.t + (H - SAFE.t - SAFE.b - h) / 2);
  UI.block(0, 0, W, H, onClose);
  g.globalAlpha = 0.55; rect(0, 0, W, H, C.ink); g.globalAlpha = 1;
  panel(x, y, w, h, 'GALAKSİ LİGİ');
  text('SPRİNT VE DÜELLOLARDAN PUAN', x + w / 2, y + 18, C.gray, 'center');
  rows.forEach((r, i) => {
    const yy = y + 30 + i * rh, def = RIVAL_BY_ID[r.id];
    if (r.me) { rrect(x + 4, yy - 2, w - 8, rh - 1, C.slate); }
    text((i + 1) + '.', x + 10, yy, i === 0 ? C.gold : C.lgray);
    text(r.name, x + 24, yy, r.me ? C.yellow : def ? (STYLE_COL[def.style] || C.white) : C.white);
    text(r.pts + ' P', x + w - 10, yy, r.me ? C.yellow : C.white, 'right');
  });
  text('GEZEGEN SONU: 1. +' + LEAGUE_BONUS[0] + ' · 2. +' + LEAGUE_BONUS[1] + ' · 3. +' + LEAGUE_BONUS[2] + ' KRİSTAL', x + w / 2, y + h - 13, C.cyan, 'center');
}

function growCrops() {
  let grew = 0;
  for (let i = 0; i < plotCount(); i++) {
    const c = META.crops[i]; if (!c) continue;
    const tp = Math.floor(c / 10), st = c % 10; if (st >= 3) continue;

    META.crops[i] = c + 1; grew++;

  return grew;
}

const PLANET_PAL = [
  [C.plum, C.purple, C.magenta, C.salmon],   // Lumo Çayırı
  [C.teal, C.ddgreen, C.dgreen, C.green],    // Mantar Ayı

function drawPlanet(x, y, r, reg) {
  const p = PLANET_PAL[clamp(reg | 0, 0, PLANET_PAL.length - 1)], ringed = reg === 2 || reg >= LAST_REGION;
  const ringArc = front => { for (let a = 0; a < Math.PI * 2; a += 0.025) { const sn = Math.sin(a); if (front ? sn < 0 : sn >= 0) continue; pix(Math.round(x + Math.cos(a) * r * 1.7), Math.round(y + sn * r * 0.3), C.cyan); } };
  if (ringed) { g.globalAlpha = 0.6; ringArc(false); g.globalAlpha = 1; }
  circle(x, y, r + 1, C.ink); circle(x, y, r, p[0]); circle(x - 2, y - 2, r - 3, p[1]); circle(x - 5, y - 5, Math.round(r * 0.45), p[2]); circle(x - 7, y - 8, Math.max(1, Math.round(r * 0.15)), p[3]);
  // soft bands / craters so it does not read as a flat disc
  g.globalAlpha = 0.25;
  for (let i = -r + 4; i < r - 2; i += 6) { const dx = Math.floor(Math.sqrt(r * r - i * i)) - 2; if (dx > 2) hline(x - dx, y + i, dx * 2, p[0]); }
  g.globalAlpha = 1;
  if (reg === 1) { circle(x + 6, y + 5, 3, p[0]); circle(x - 8, y + 9, 2, p[0]); circle(x + 9, y - 6, 2, p[0]); }
  if (ringed) ringArc(true);
}

    for (let r = 30, i = 0; r > 10; r -= 5, i++) { g.globalAlpha = 0.18 + 0.06 * i + 0.05 * Math.sin(T * 3 + i); ring(gx, gy, r, C.cyan); }
    g.globalAlpha = 1; circle(gx, gy, 9, C.white); circle(gx, gy, 7, C.cyan);
    textO('KAPI AÇIK', W / 2, gy + 36, C.cyan, 'center', 2);
    textBlock('KUPA KAPIYI BİR KEZ DAHA AÇTI. DOSYASINI AÇTIĞIN BİR RAKİBİ EVİNE GÖNDER. GİDEN BİR DAHA PİSTE ÇIKMAZ.', W / 2, gy + 56, W - 24, C.lgray, 'center');
    const top = gy + 88, rowH = 30, bw = Math.min(W - 16, 220), bx = Math.round(W / 2 - bw / 2);
    const maxRows = Math.max(3, Math.floor((H - SAFE.b - 60 - top) / rowH));
    this.list.slice(0, maxRows).forEach((r, i) => {
      const y = top + i * rowH, info = RIVAL_INFO[r.id] || {}, sel = this.sel === r.id;
      rrect(bx - 1, y - 1, bw + 2, rowH - 2, sel ? C.cyan : C.ink); rrect(bx, y, bw, rowH - 4, sel ? C.slate : C.navy);
      if (PORTRAIT[r.id]) { const p = PORTRAIT[r.id]; g.drawImage(p, 6, 2, 16, 20, bx + 3, y + 2, 16, 20); }
      text(r.name, bx + 24, y + 3, STYLE_COL[r.style] || C.white);
      text(info.home || '', bx + 24, y + 13, C.gray);
      UI.add('lib_' + r.id, bx, y, bw, rowH - 4, () => { this.sel = r.id; Sound.play('select'); });
    });
    const by = H - SAFE.b - 34, half = Math.floor((bw - 6) / 2);
    button('lib_later', bx, by, half, 20, 'SONRA', () => go('farm', { fromRun: true }), { kind: 'secondary' });
    button('lib_go', bx + half + 6, by, half, 20, 'EVE GÖNDER', () => this.free(this.sel), { kind: 'green', disabled: !this.sel || this.done });
    text('EVE GÖNDERME HAKKI: ' + (META.freeTokens || 0), W / 2, by - 12, C.yellow, 'center');
    drawParts(0, 0); drawTexts(); drawFlash();
  }
};

// ================= AUTOPLAY (testing) =================
// window.__autoSkill (0..1) makes the bot miss some notes; window.__autoNoHamle turns off bursts.
SCENES.run.autoPlay = function () {
  const P = this.P, S = this.S, skill = window.__autoSkill == null ? 1 : window.__autoSkill;
  // ---- rhythm: press near the note centre, keep holds pressed until they end ----
  if (this.clockOn) {
    const bp = Beat.pos(now());
    this.ensureTargets(bp);
    const tg = this.nextTarget(bp);
    if (tg && !tg.done && tg !== this.autoSkip && Math.abs(tg.t - bp) * Beat.iv < S.perfectWin * 0.5) {
      if (Math.random() < skill) { this.down(P.x, this.pY, now()); this.tap(); }
      else this.autoSkip = tg;
    }
    if (this.hold && bp >= this.hold.end - 0.08) this.up(P.x, this.pY, false);
  }
  if (this.bond >= 100 && (this.boss || this.reis || this.foes.length > 1 || this.storm)) this.useAbility();
  // ---- breath bursts ----
  const cost = this.hamleCostNow();
  if (!window.__autoNoHamle && P.hamleT <= 0 && P.hamleCd <= 0 && this.nefes >= cost && !this.tut) {
    const B = this.boss;
    if ((B && B.taunt > 0) || (this.storm && this.storm.gap < 45) || (B && this.nefes >= 75) ||
      (this.type !== 'boss' && this.nefes >= 92 && P.dist < this.length * 0.72)) this.hamle();
  }
  if (P.laneT < 1) return;
  const lx = l => this.laneX(l);
  // how soon (in px) something nasty reaches us in this lane; 999 = clear
  const danger = lane => {
    if (lane < 0 || lane > 4) return -1;
    let d = 999;
    const o = this.obsAhead(lane, P.dist, 90);
    if (o && SOLID[o.kind]) d = o.y - P.dist;
    for (const f of this.foes) {
      if (f.dead || f.tut || f.kind === 'domuz') continue;
      const fd = f.dist - P.dist; if (fd < -2 || fd > 95) continue;
      if (Math.abs(f.x - lx(lane)) < 12) d = Math.min(d, fd);
    }
    for (const f of this.foes) if (!f.dead && f.kind === 'okcu' && f.aim && f.aimLane === lane) d = Math.min(d, 25);
    for (const s of this.eShots) { const sd = s.dist - P.dist; if (sd > -6 && sd < 170 && Math.abs(s.x - lx(lane)) < 9) d = Math.min(d, Math.max(4, sd * 0.4)); }
    const Rz = this.reis;
    if (Rz && !Rz.dead) {
      if (Rz.aimLanes && Rz.aimLanes.indexOf(lane) >= 0) d = Math.min(d, 25);
      const rd = Rz.dist - P.dist;
      if (Math.abs(Rz.x - lx(lane)) < 13 && rd > -8 && rd < (Rz.charge > 0.7 ? 170 : 55)) d = Math.min(d, Math.max(4, rd));
      if (Rz.charge > 0.7 && Rz.lane === lane) d = Math.min(d, 20);
    }
    for (const b of this.bolts) if (b.lane === lane && b.strike <= 0) d = Math.min(d, 15);
    for (const o of this.obs) {
      if (o.dead || o.kind !== 'scan') continue;
      const dd = o.y - P.dist; if (dd < -4 || dd > 120) continue;
      if (o.lane === lane) d = Math.min(d, Math.max(4, dd));
      else if (o.lane + o.dir === lane || (o.lane + o.dir < 0 || o.lane + o.dir > 4) && o.lane - o.dir === lane) d = Math.min(d, Math.max(6, dd + 10));
    }
    return d;
  };
  const d0 = danger(P.lane);
  if (d0 < 80) {
    const opts = [P.lane - 1, P.lane + 1].filter(l => l >= 0 && l <= 4).sort((a, b) => danger(b) - danger(a));
    if (opts.length && danger(opts[0]) > d0) { this.changeLane(opts[0]); return; }
  }
  // ---- jumps, timed for a clean landing over the middle ----
  if (!P.jumping && P.flyT <= 0) {
    const jd = P.speed * S.jumpTime * 0.42 + 6;
    for (const o of this.obs) {
      if (o.dead || !JUMPABLE[o.kind]) continue;
      const dy = o.y - P.dist, rel = o.kind === 'bale' ? jd * 1.35 : jd;
      if (dy > 1 && dy < rel && this.overlapX(o, P.x, 4)) { this.jump(); return; }
    }
    for (const f of this.foes) {
      if (f.dead || f.kind !== 'domuz') continue;
      const dy = f.dist - P.dist, rel = (P.speed + 75) * S.jumpTime * 0.42 + 8;
      if (dy > 1 && dy < rel && Math.abs(f.x - P.x) < 10) { this.jump(); return; }
    }
  }
  if ((this.autoCd || 0) > this.time) return;
  const move = nl => { this.autoCd = this.time + 0.3; this.changeLane(nl); };
  if (P.draftFull) { const opts = [P.lane - 1, P.lane + 1].filter(l => l >= 0 && l <= 4 && danger(l) > 90); if (opts.length) { move(opts[0]); return; } }
  // ---- hunt foes (raids first), otherwise hug the inner rail in bends ----
  const bend = this.bendAt(P.dist + 90);
  let tgt = null;
  if (this.type === 'baskin' || !bend) {
    for (const f of this.foes) {
      if (f.dead || f.tut || (f.kind === 'kalkanli' && f.stun <= 0 && S.weapon === 'yay')) continue;
      const fd = f.dist - P.dist; if (fd < 45 || fd > 230) continue;
      if (!tgt || fd < tgt.dist - P.dist) tgt = f;
    }
    const Rz = this.reis; if (!tgt && Rz && !Rz.dead && Rz.charge <= 0 && Rz.dist - P.dist > 60) tgt = Rz;
  }
  if (tgt) {
    const tl = this.laneOfX(tgt.x);
    if (tl !== P.lane) { const nl = P.lane + Math.sign(tl - P.lane); if (danger(nl) > 90) { move(nl); return; } }
  } else if (bend) {
    const inner = bend < 0 ? 0 : 4;
    if (P.lane !== inner) { const nl = P.lane + Math.sign(inner - P.lane); if (danger(nl) > 100) { move(nl); return; } }
  }
};

// ================= MAIN LOOP =================
function update(dt) {
  updateTrans(dt);
  Dialog.update(dt);
  if (scene && scene.update) scene.update(dt);
  Music.tick();
}
function render(dt) {
  UI.begin();
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1;
  if (scene && scene.draw) scene.draw();
  Dialog.draw();
  drawToasts(dt);
  drawTrans();
  if (LAST_ERROR) { g.globalAlpha = 1; rect(0, H - 44, W, 44, C.ink); textBlock('HATA: ' + LAST_ERROR.slice(0, 160), 4, H - 42, W - 8, C.red); }
  ctx.drawImage(buf, 0, 0, W * SCALE, H * SCALE);
}
let lastFrame = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  const t = ts / 1000;
  let dt = lastFrame ? t - lastFrame : 1 / 60;
  lastFrame = t;
  if (dt > 0.05) dt = 0.05; if (dt < 0) dt = 0;
  dt *= (window.__speed || 1);
  T += dt;
  try { update(dt); render(dt); } catch (e) { reportError(e); }
}
function onVisibility() {
  if (document.hidden) {
    if (META) saveMeta();
    if (scene === SCENES.run && !SCENES.run.paused && (SCENES.run.state === 'run' || SCENES.run.state === 'intro')) SCENES.run.togglePause();
    else Music.stop();
  } else {
    try { if (Sound.ac && Sound.ac.state !== 'running') Sound.ac.resume(); } catch (e) { }
    if (scene === SCENES.farm) Music.play('farm', now() + 0.2, false);
    else if (scene === SCENES.doors || scene === SCENES.shop || scene === SCENES.boon || scene === SCENES.event || scene === SCENES.cekic) Music.play(REGIONS[RUN.region].song, now() + 0.2, false);
  }
}
function boot() {
  const hot = window.claude && window.claude.hot;
  const start = async data => {
    loadMeta(data || {});
    nativeAudio();
    await loadPixelLabArt();
    buildArt();
    resize();
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', () => setTimeout(resize, 250));
    document.addEventListener('visibilitychange', onVisibility);
    window.addEventListener('pagehide', () => { if (META) saveMeta(); });
    if (hot && hot.snapshot) { try { hot.snapshot(() => ({ save: JSON.stringify(META) })); } catch (e) { } }
    goNow('title');
    requestAnimationFrame(frame);
  };
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
}

// debug / test hooks
window.__dortnala = {
  meta: () => META, run: () => RUN, scene: () => scene && scene.name, sceneObj: () => scene,
  go: (n, a) => goNow(n, a),
  start: (node, opts) => { newRun(opts); goNow('run', node || firstNode()); },
  newRun: opts => newRun(opts),
  set: patch => { mergeInto(META, patch); saveMeta(); },
  size: () => ({ W, H, SCALE, SAFE }),
  error: () => LAST_ERROR,
  beat: () => Beat.pos(now()), iv: () => Beat.iv, stats: () => computeStats(RUN),
  art: () => { const RACERS = {}; for (const k in ALIEN_LOOKS) RACERS[k] = getMount(k); RACERS.voltrak = getHorse('robot', 'voltrak'); RACERS.deniz = getHorse('bay', 'deniz'); return { BLD, PEOPLE, PORTRAIT, OB, FOE_SPR, ICONS, PROJ, MEDAL, RACERS }; },
  calib: () => Calib.st,
  rects: () => UI.prev.map(r => ({ id: r.id, x: r.x, y: r.y, w: r.w, h: r.h }))
};
boot();

})();
