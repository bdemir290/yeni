<!doctype html><html lang="tr"><meta charset="utf-8"><title>Dörtnala · Asset karşılaştırması</title><style>body{background:#181425;color:#ead4aa;font:16px system-ui;padding:24px}main{display:flex;gap:32px;flex-wrap:wrap}canvas{image-rendering:pixelated;width:360px;height:300px;border:1px solid #5a6988}iframe{width:360px;height:640px;border:1px solid #5a6988}button{padding:12px;margin:12px;background:#2ce8f5;border:0;cursor:pointer}pre{white-space:pre-wrap}</style><h1>Dörtnala · İlk PixelLab seti</h1><button onclick="race()">Yarış karşılaştırmasını başlat</button><button onclick="jump()">Sıçrama</button><button onclick="farm()">İstasyon</button><main><section><h2>Önce</h2><canvas id="a" width="120" height="100"></canvas><br><iframe id="old" src="dist/before-pixellab.html"></iframe></section><section><h2>PixelLab</h2><canvas id="b" width="120" height="100"></canvas><br><iframe id="fresh" src="../Dortnala/index.html"></iframe></section></main><pre id="status">Yükleniyor…</pre><script>const frames=[document.getElementById('old'),document.getElementById('fresh')];function race(){for(const f of frames){const w=f.contentWindow;w.__auto=true;w.__dortnala.start(null,{daily:true});}}function jump(){for(const f of frames)f.contentWindow.__dortnala.sceneObj().jump?.()}function farm(){for(const f of frames)f.contentWindow.__dortnala.go('farm')}setInterval(()=>{let stats=[];frames.forEach((f,i)=>{const api=f.contentWindow.__dortnala;if(!api||!api.scene())return;const art=api.art();const c=document.getElementById(i?'b':'a'),g=c.getContext('2d');g.clearRect(0,0,120,100);const phase=Math.floor(Date.now()/140)%4;g.drawImage(art.RACERS.deniz.frames[phase],14,12);g.drawImage(art.RACERS.deniz.jump,48,12);g.drawImage(art.RACERS.r1.frames[phase],82,12);['grax','moko','bip'].forEach((k,j)=>g.drawImage(art.PORTRAIT[k],10+j*36,65));stats.push((i?'Yeni':'Eski')+': '+api.scene()+' | hata: '+(api.error()||'yok')+' | at '+art.RACERS.deniz.frames[0].width+'×'+art.RACERS.deniz.frames[0].height+' | r1 '+art.RACERS.r1.frames[0].width+'×'+art.RACERS.r1.frames[0].height)});document.getElementById('status').textContent=stats.join('\n')},140);</script></html>
